<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/></head><body class="bg-background font-body-md text-on-background"><main class="w-full flex items-center justify-center min-h-screen"><div class="flex flex-col w-full relative min-h-[calc(100vh-80px)] items-center justify-center overflow-hidden bg-background">
<!-- Ambient Background Elements -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none overflow-hidden mix-blend-multiply opacity-40">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-surface-tint blur-[120px] opacity-30 animate-[pulse_8s_ease-in-out_infinite]"></div>
<div class="absolute top-[40%] -right-[20%] w-[50%] h-[50%] rounded-full bg-secondary-fixed blur-[100px] opacity-40 animate-[pulse_10s_ease-in-out_infinite_alternate]"></div>
<div class="absolute -bottom-[10%] left-[20%] w-[40%] h-[40%] rounded-full bg-primary blur-[80px] opacity-20"></div>
<!-- Abstract Leaf/Grain SVG Overlay -->
<svg class="absolute inset-0 w-full h-full opacity-10" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="100" id="grain" patternunits="userSpaceOnUse" width="100">
<circle class="text-primary-fixed" cx="2" cy="2" fill="currentColor" r="1"></circle>
<circle class="text-secondary-fixed" cx="50" cy="50" fill="currentColor" r="1.5"></circle>
<path class="text-surface-tint" d="M20,80 Q30,60 50,80 T80,80" fill="none" stroke="currentColor" stroke-dasharray="2 4" stroke-width="0.5"></path>
</pattern>
</defs>
<rect fill="url(#grain)" height="100%" width="100%"></rect>
</svg>
</div>
<!-- Main Content Container -->
<div class="relative z-10 flex flex-col items-center justify-center w-full max-w-4xl px-gutter text-center gap-xl">
<!-- App Logo/Branding Element -->
<div class="flex flex-col items-center gap-md">
<div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-lg shadow-primary/20 backdrop-blur-md">
<span class="material-symbols-outlined text-[32px] text-on-primary" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-background tracking-tight">Gram<span class="text-primary">AI</span></h1>
</div>
<!-- Tagline & Description -->
<div class="flex flex-col gap-md max-w-2xl">
<h2 class="font-headline-lg text-headline-lg text-on-background">Empowering Rural Entrepreneurs with AI Intelligence</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xl mx-auto">
                Unlock actionable insights, optimize your agricultural business, and connect with global markets using advanced, localized artificial intelligence.
            </p>
</div>
<!-- Call to Action Area -->
<div class="flex flex-col sm:flex-row items-center gap-md mt-lg">
<button class="group relative px-8 py-4 bg-primary text-on-primary rounded-full font-label-sm text-label-sm overflow-hidden transition-transform hover:scale-105 active:scale-95 shadow-md shadow-primary/30">
<span class="relative z-10 flex items-center gap-sm">
                    Start Your Journey
                    <span class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</span>
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
</button>
<!-- Language Selector -->
<div class="relative" id="langDropdownWrapper">
<button class="flex items-center gap-sm px-6 py-4 bg-surface-container text-on-surface rounded-full font-label-sm text-label-sm transition-colors hover:bg-surface-container-high focus:outline-none focus:ring-2 focus:ring-primary/50" id="langBtn">
<span class="material-symbols-outlined text-[18px]">language</span>
<span id="currentLang">English</span>
<span class="material-symbols-outlined text-[18px] transition-transform" id="langIcon">expand_more</span>
</button>
<!-- Dropdown Menu -->
<div class="absolute top-full left-0 mt-xs w-full min-w-[160px] bg-surface-container-lowest rounded-xl shadow-xl shadow-on-background/5 opacity-0 invisible translate-y-2 transition-all duration-200 z-50" id="langMenu">
<div class="flex flex-col py-xs">
<button class="lang-option w-full text-left px-md py-sm hover:bg-surface-container-low font-body-md text-body-md text-on-surface transition-colors" data-lang="English">English</button>
<button class="lang-option w-full text-left px-md py-sm hover:bg-surface-container-low font-body-md text-body-md text-on-surface transition-colors" data-lang="हिंदी (Hindi)">हिंदी (Hindi)</button>
<button class="lang-option w-full text-left px-md py-sm hover:bg-surface-container-low font-body-md text-body-md text-on-surface transition-colors" data-lang="मराठी (Marathi)">मराठी (Marathi)</button>
<button class="lang-option w-full text-left px-md py-sm hover:bg-surface-container-low font-body-md text-body-md text-on-surface transition-colors" data-lang="தமிழ் (Tamil)">தமிழ் (Tamil)</button>
</div>
</div>
</div>
</div>
</div>
<!-- Decorative Bottom Elements -->
<div class="absolute bottom-0 w-full flex justify-between items-end p-gutter pointer-events-none opacity-50">
<div class="font-mono-label text-mono-label text-outline uppercase tracking-wider writing-vertical-rl">v2.4.0-beta</div>
<div class="flex gap-xs">
<div class="w-2 h-2 rounded-full bg-secondary-fixed animate-ping"></div>
<div class="font-mono-label text-mono-label text-outline uppercase">System Online</div>
</div>
</div>
<style>
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
        .writing-vertical-rl {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
        }
    </style>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const langBtn = document.getElementById('langBtn');
            const langMenu = document.getElementById('langMenu');
            const langIcon = document.getElementById('langIcon');
            const currentLang = document.getElementById('currentLang');
            const langOptions = document.querySelectorAll('.lang-option');
            const wrapper = document.getElementById('langDropdownWrapper');

            let isOpen = false;

            const toggleMenu = () => {
                isOpen = !isOpen;
                if (isOpen) {
                    langMenu.classList.remove('opacity-0', 'invisible', 'translate-y-2');
                    langMenu.classList.add('opacity-100', 'visible', 'translate-y-0');
                    langIcon.style.transform = 'rotate(180deg)';
                } else {
                    langMenu.classList.add('opacity-0', 'invisible', 'translate-y-2');
                    langMenu.classList.remove('opacity-100', 'visible', 'translate-y-0');
                    langIcon.style.transform = 'rotate(0deg)';
                }
            };

            langBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMenu();
            });

            langOptions.forEach(option => {
                option.addEventListener('click', (e) => {
                    currentLang.textContent = e.target.dataset.lang;
                    toggleMenu();
                    
                    // Add subtle highlight effect to selection
                    e.target.classList.add('bg-primary/10', 'text-primary');
                    setTimeout(() => {
                        e.target.classList.remove('bg-primary/10', 'text-primary');
                    }, 200);
                });
            });

            // Close when clicking outside
            document.addEventListener('click', (e) => {
                if (isOpen && !wrapper.contains(e.target)) {
                    toggleMenu();
                }
            });
        });
    </script>
</div></main></body></html>
