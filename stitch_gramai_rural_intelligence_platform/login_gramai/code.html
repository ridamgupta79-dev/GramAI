</div>
<div>
<div class="flex justify-between items-center mb-sm">
<label class="block font-label-sm text-label-sm text-on-surface-variant">Password</label>

</div>

<input class="w-full bg-surface-container px-md py-sm rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/50 transition-shadow" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>

</div>
</div>
<button class="w-full bg-primary text-on-primary font-title-md text-title-md py-sm rounded-lg hover:bg-on-primary-fixed-variant transition-colors mt-lg shadow-md hover:shadow-lg" onclick="showOTP()">Continue</button>
</div>
</div>
<div class="hidden opacity-0 transition-opacity duration-300 absolute top-0 left-0 w-full h-full p-lg pt-[116px]" id="register-form">
<div class="space-y-md">
<div>

<input class="w-full bg-surface-container px-md py-sm rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/50 transition-shadow" placeholder="Kisan Kumar" type="text"/>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-sm">Mobile Number</label>
<input class="w-full bg-surface-container px-md py-sm rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/50 transition-shadow" placeholder="+91" type="tel"/>
</div>
<button class="w-full bg-primary text-on-primary font-title-md text-title-md py-sm rounded-lg hover:bg-on-primary-fixed-variant transition-colors mt-lg shadow-md hover:shadow-lg" onclick="showOTP()">Send OTP</button>
</div>
</div>
<div class="hidden opacity-0 transition-opacity duration-300 absolute top-0 left-0 w-full h-full bg-surface-container-lowest p-lg z-20 flex flex-col justify-center" id="otp-form">
<button class="absolute top-md left-md text-on-surface-variant hover:text-on-surface p-sm" onclick="hideOTP()">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="text-center mb-xl mt-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container mb-md">
<span class="material-symbols-outlined text-on-primary-container text-3xl">dialpad</span>
</div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">Verification</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Enter the 4-digit code sent to your device.</p>
</div>
<div class="flex justify-center gap-sm mb-xl">
<input class="w-12 h-14 text-center text-title-md font-title-md bg-surface-container rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50" maxlength="1" type="text" value="4"/>
<input class="w-12 h-14 text-center text-title-md font-title-md bg-surface-container rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50" maxlength="1" type="text" value="9"/>
<input class="w-12 h-14 text-center text-title-md font-title-md bg-surface-container rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-title-md font-title-md bg-surface-container rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/50" maxlength="1" type="text"/>
</div>
<button class="w-full bg-secondary text-on-secondary font-title-md text-title-md py-sm rounded-lg hover:bg-on-secondary-fixed-variant transition-colors shadow-md">Verify & Proceed</button>
<p class="text-center mt-lg font-label-sm text-label-sm text-on-surface-variant">Didn't receive code? <button class="text-primary hover:underline">Resend in 0:45</button></p>
</div>
<div class="mt-xl pt-lg relative flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full h-[1px] bg-outline-variant/30"></div>
</div>
<div class="relative bg-surface-container-lowest px-md font-mono-label text-mono-label text-on-surface-variant uppercase">Or continue with</div>
</div>
<div class="mt-lg space-y-sm">
<button class="w-full flex items-center justify-center gap-md py-sm rounded-lg bg-surface hover:bg-surface-container transition-colors shadow-sm">
<img class="w-5 h-5 object-contain rounded-full" data-alt="Google G logo icon, minimalist flat design, colorful" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDjimuKyoYYgy43ISRyCiWgQ0F-p71hKUqx87Lfe0aIpcWmi8GhBlZV4AqFiSYYQdpvQsWuGCUkLkTFGPrjFUQAK0h4KNsIkrRCevZCFudE_vmjYFCPC3xRYQJN539a8-7lZ_MkzMnwuM1Evbr2ZHq-OBqx_YKsQEIvJ5FJrweWAWZ9JT-HQ1s3KSsWQQ-mm7lpQUvJK55AxZGnKWWn5zRL9h49-RBWJiFL7OIYCMfZ519raUeWyCrr"/>
<span class="font-label-sm text-label-sm text-on-surface">Google</span>
</button>
<button class="w-full flex items-center justify-center gap-md py-sm rounded-lg bg-surface hover:bg-surface-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-secondary text-[20px]">fingerprint</span>
<span class="font-label-sm text-label-sm text-on-surface">Rural Digital ID</span>
</button>
</div>
</div>
</div>
</div>
<div class="fixed bottom-lg left-0 w-full flex justify-center text-center px-md z-0 pointer-events-none">
<p class="font-mono-label text-mono-label text-on-surface-variant opacity-60 max-w-sm">Secure access to GramAI intelligence platform. Protected by enterprise-grade encryption.</p>
</div>
</div>
<script>
  function switchTab(tab) {
    const indicator = document.getElementById('tab-indicator');
    const loginBtn = document.getElementById('btn-login');
    const registerBtn = document.getElementById('btn-register');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    
    if (tab === 'register') {
      indicator.style.transform = 'translateX(100%)';
      loginBtn.classList.replace('text-on-surface', 'text-on-surface-variant');
      registerBtn.classList.replace('text-on-surface-variant', 'text-on-surface');
      
      loginForm.style.opacity = '0';
      setTimeout(() => {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        setTimeout(() => registerForm.style.opacity = '1', 10);
      }, 300);
    } else {
      indicator.style.transform = 'translateX(0)';
      registerBtn.classList.replace('text-on-surface', 'text-on-surface-variant');
      loginBtn.classList.replace('text-on-surface-variant', 'text-on-surface');
      
      registerForm.style.opacity = '0';
      setTimeout(() => {
        registerForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        setTimeout(() => loginForm.style.opacity = '1', 10);
      }, 300);
    }
  }

  function showOTP() {
      const otpForm = document.getElementById('otp-form');
      otpForm.classList.remove('hidden');
      setTimeout(() => otpForm.style.opacity = '1', 10);
  }

  function hideOTP() {
      const otpForm = document.getElementById('otp-form');
      otpForm.style.opacity = '0';
      setTimeout(() => otpForm.classList.add('hidden'), 300);
  }
</script></main></body></html>
